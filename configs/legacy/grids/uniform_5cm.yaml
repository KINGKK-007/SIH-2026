# ─────────────────────────────────────────────────────────────────────────────
# Grid preset: uniform_5cm
#
# Single-ring uniform 5 cm grid over ±100 m square.
# Used as the high-resolution accuracy baseline in E1, E3, E4, E9.
#
# Total cells: 4000×4000 = 16,000,000
# At 8 bytes/cell: 128 MB (dense array)
# ─────────────────────────────────────────────────────────────────────────────

preset: uniform_5cm

rings:
  - cell_m: 0.05
    half_extent_m: 100.0

z_range_m: [-3.0, 5.0]
max_range_m: 100
ring_shape: square
aggregation: safety_priority
min_obs_points: 2
min_dyn_points: 2
