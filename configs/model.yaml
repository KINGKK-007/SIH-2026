# Segmentation model (README 8.2).
#
# D-022 (docs/DECISIONS.md) overrides README L11: the production model is LSK3DNet (a pretrained
# sparse large-kernel voxel network, CVPR 2024, 75.6% mIoU on the SemanticKITTI val split) instead of
# a range-view network (SalsaNext/CENet/RangeNet++). `family: sparse_voxel` selects
# `foveamap.models.lsk3dnet.LSK3DNetModel`; `input:` below is unused in that family and kept null.
name: "lsk3dnet"
family: "sparse_voxel"         # "rangeview" | "sparse_voxel"
checkpoint: "configs/weights/opensource_9ks_s030_w64_0.pt"   # [HUMAN] download, see configs/weights/WEIGHTS.md
device: cuda                   # cached mode (models/cache.py) needs no GPU; live/caching needs cuda
input:
  height: null
  width: null
  fov_up_deg: null
  fov_down_deg: null
  mean: null
  std: null
knn_postprocess: false         # LSK3DNet has no range-image back-projection stage
cache_dir: data/cache/pred
seed: 1337
finetune:
  enabled: false
  distance_weight_alpha: 1.0

lsk3dnet:
  repo_dir: "LSK3DNet-main"
  config_path: "LSK3DNet-main/config/lk-semantickitti_sub_tta.yaml"
  half_precision: true
  vram_budget_gb: 6.0           # the inference GPU is a teammate's RTX 4050 laptop (6 GB), not this dev machine
  empty_cache_every_scan: true
