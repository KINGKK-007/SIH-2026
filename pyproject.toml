[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foveamap"
version = "0.2.0.dev0"
description = "Foveated 2.5D LiDAR semantic mapping: sharp where a mistake hurts, cheap where it doesn't."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "FoveaMap contributors" }]
requires-python = ">=3.10"
keywords = ["lidar", "autonomous-driving", "semantic-segmentation", "elevation-map"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core runtime only; the full environment (torch, server, test tools) is requirements.txt (README 4.5).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2",
]

[project.scripts]
foveamap = "foveamap.cli:main"
foveamap-legacy = "foveamap_legacy.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/foveamap", "src/foveamap_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test modules with the same name may live in several tests/ subfolders (D-009).
addopts = "--import-mode=importlib --strict-markers -ra"
markers = [
    "slow: takes more than 10 s",
    "gpu: needs CUDA",
    "data: needs the SemanticKITTI files",
    "cpp: needs the compiled C++ backend",
    "legacy: v0 implementation kept as reference (src/foveamap_legacy)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/foveamap_legacy", "tests/legacy", "src/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N802", "N803", "N806", "E501"]  # maths names (Tr, P_i); line length is enforced by black

[tool.black]
line-length = 110
target-version = ["py310"]
extend-exclude = "src/foveamap_legacy|tests/legacy|src/dashboard"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["src/foveamap_legacy"]

[tool.coverage.run]
source = ["foveamap"]
