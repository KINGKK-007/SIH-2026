services:
  - type: web
    name: foveamap-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements-render.txt && pip install -e ."
    startCommand: "foveamap serve --mode oracle --sequence 08 --data-root demo_data --host 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: CORS_ORIGINS
        sync: false
